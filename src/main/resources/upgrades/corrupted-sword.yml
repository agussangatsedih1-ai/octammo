# Open with /itemupgrade corrupted-sword   (or /octammo:itemupgrade corrupted-sword)
# A file is a "station". Each entry under `upgrades:` is a "path". With several paths the player first
# sees a path menu; /itemupgrade <file> <path> opens one path directly.
#
# In the GUI the player puts the item to upgrade AND every item cost into the slots, then presses the button.
# Money and XP levels are charged from the player.
#
# recipe format:  INPUT + COST + COST ... => OUTPUT (CHANCE%)
#   INPUT / OUTPUT : MMOITEM:<TYPE>:<ID>[:amount]       (input amount is always 1 per attempt)
#   COST           : MONEY:<amount>                     (Vault - Excellent Economy works through Vault)
#                    LEVELS:<amount>                    (XP levels)
#                    MMOITEM:<TYPE>:<ID>[:amount]       (goes into a rune slot)
#                    ITEM:<MATERIAL>[:amount]           (plain vanilla item, goes into a rune slot)
#   CHANCE         : optional, default 100
# on-fail: KEEP    -> costs are spent, the input item is returned
#          DESTROY -> costs are spent, the input item is consumed (unless a protection item is inserted)

title: "&5Corrupted Forge"
gui: default-upgrade          # file in guis/ (without .yml)
# permission: "myserver.forge"   # optional extra permission for the whole station
# animation:
#   duration-ticks: 160          # override gui-animation.duration-ticks for this station

# Optional items for the booster slot: +bonus percentage points, one item used per attempt
boosters:
  lucky-dust:
    item: "MMOITEM:MISCELLANEOUS:LUCKY_DUST"
    bonus: 10

# Optional items for the protection slot: used up only when it saves an item that would be destroyed
protections:
  safe-scroll:
    item: "MMOITEM:MISCELLANEOUS:SAFE_SCROLL"

upgrades:
  corrupted-sword-1:
    name: "&5Corrupted Sword &7-> &d+1"
    description:
      - "&7Reforge the blade with corrupted shards."
    recipe: "MMOITEM:SWORD:CORRUPTED_SWORD + MONEY:5000 + LEVELS:5 + MMOITEM:MISCELLANEOUS:CORRUPTED_SHARD:3 + ITEM:DIAMOND:2 => MMOITEM:SWORD:CORRUPTED_SWORD_PLUS1 (80%)"
    on-fail: KEEP
    on-success:
      commands: []              # console commands, {player} is replaced
      sound: ENTITY_PLAYER_LEVELUP
  corrupted-sword-2:
    name: "&5Corrupted Sword &d+1 &7-> &d+2"
    recipe: "MMOITEM:SWORD:CORRUPTED_SWORD_PLUS1 + MONEY:15000 + LEVELS:10 + MMOITEM:MISCELLANEOUS:CORRUPTED_SHARD:8 => MMOITEM:SWORD:CORRUPTED_SWORD_PLUS2 (50%)"
    on-fail: DESTROY
    # permission: "myserver.forge.tier2"
    animation:
      duration-ticks: 160
    on-fail-effects:
      commands: []
