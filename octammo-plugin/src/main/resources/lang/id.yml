config-version: 3

no-permission: "{prefix} &cKamu tidak punya izin untuk itu."
player-only: "{prefix} &cHanya pemain yang bisa memakai perintah ini."
player-not-found: "{prefix} &cPemain tidak ditemukan: &f{player}"
module-disabled: "{prefix} &cModul ini dinonaktifkan."
reloaded: "{prefix} &aDimuat ulang. &7({files} stasiun, {rules} signature template)"
version: "{prefix} &7Versi &f{version}&7, MMOItems ditemukan: &f{mmoitems}"
help:
