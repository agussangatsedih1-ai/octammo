# OctaMMO 1.0.3 - main config
# Missing keys are added automatically after an update (your values are never touched,
# the old file is copied to backups/ first).
config-version: 4

# en | id  (files in plugins/OctaMMO/lang/, any key missing in id.yml falls back to en.yml)
language: en

# auto = &-codes, &#RRGGBB, &x&R&R... or MiniMessage tags are detected per text
# legacy = never MiniMessage, minimessage = always MiniMessage
text-format: auto

# Used through the {prefix} placeholder in lang files
prefix: '&8[&x&F&F&0&0&0&0&lO&x&F&4&0&0&2&B&lc&x&E&9&0&0&5&5&lt&x&D&F&0&0&8&0&la&x&D&4&0&0&A&A&lM&x&C&9&0&0&D&5&lM&x&B&E&0&0&F&F&lO&8]'

modules:
  item-upgrade: true

# --------------------------------------------------------------------------- Item Upgrade
upgrade:
  # Ask "are you sure?" (guis/confirm.yml) when a failure costs the input item and no protection item is inserted
  confirm-destroy: true
  # Creative players can duplicate items in custom GUIs, so they are refused by default
  allow-creative: false
  # Players also need octammo.upgrade.<station id> for every station
  require-station-permission: false
  global-cooldown: 0        # seconds between two upgrades of a player, any station
  # Highest value of the "result amount" button (a path can override it with output.max-multiplier).
  # It is also limited by the stack size of the input item and by the number of rune slots.
  max-multiplier: 16

# Title loading shown after the upgrade button: the GUI closes, the title counts 1% -> 100%,
# then the result is delivered and the GUI opens again. No animation runs inside the GUI.
upgrade-loading:
  enabled: true
  duration-ticks: 100       # 100 ticks = 5 seconds (a station or path can override it with loading.duration-ticks)
  title: ''                 # empty = lang key upgrade.loading.title
  subtitle-format: ''       # empty = lang key upgrade.loading.subtitle, {percent} is replaced
  percent-step: 1           # send the title only every N percent (raise it to send fewer packets)
  title-times: { fade-in: 0, stay: 10, fade-out: 0 }   # ticks
  sound: { enabled: true, tick: BLOCK_NOTE_BLOCK_CHIME, every-percent: 10 }
  result-title-ticks: 40
  reopen-gui-after: true
  lock:
    freeze-movement: true   # slowness + negative jump boost, no PlayerMoveEvent listener
    invulnerable: true
    block-commands: true
    allowed-commands: []
    block-interact: true    # interact, place and break blocks
    block-inventory: true   # open / click inventory, change hotbar slot, swap hands
    block-drop-pickup: true
    block-combat: true

# Sounds: "entity.player.levelup" or "ENTITY_PLAYER_LEVELUP". Leave empty to disable one.
sounds:
  success: entity.player.levelup
  fail: entity.item.break
  click: ui.button.click
