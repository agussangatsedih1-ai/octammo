prefix: "&8[&bOcta&3MMO&8] &7"
no-permission: "&cYou don't have permission to do that."
player-only: "&cOnly players can use this command."
player-not-found: "&cPlayer not found: &f{player}"
module-disabled: "&cThis module is disabled."
reloaded: "&aOctaMMO reloaded. &7({files} upgrade file(s), {rules} update rule(s))"
version: "&7OctaMMO &f{version} &7- MMOItems: &f{mmoitems}"
help:
  - "&b/octammo reload &7- reload config, lang, guis, updates and upgrade files"
  - "&b/octammo update <player|all> &7- force an item update scan"
  - "&b/octammo upgrade <file> [player] &7- open an upgrade station"
  - "&b/octammo list &7- list upgrade files"
  - "&b/itemupgrade <file> [path] &7- open an upgrade station"

update:
  updated: "&aYour &f{count} &aitem(s) were updated to the latest version."
  scanned: "&7Scanned &f{player}&7: &f{count} &7item(s) updated."
  scanned-all: "&7Scanned &f{players} &7player(s): &f{count} &7item(s) updated."

upgrade:
  usage: "&cUsage: &f/itemupgrade <file> [path]"
  file-not-found: "&cUpgrade file not found: &f{file}"
  path-not-found: "&cPath not found: &f{path}"
  no-paths: "&cThis station has no valid paths."
  available: "&7Available files: &f{files}"
  list-empty: "&7No upgrade files loaded."
  region-denied: "&cYou can't upgrade items in this area."
  creative-denied: "&cUpgrading is not available in creative mode."
  busy: "&cAn upgrade is already in progress."
  too-many-runes: "&cPath &f{path} &cneeds more rune slots than the GUI has. Tell an admin."
  output-missing: "&cThe result item &f{item} &cdoes not exist in MMOItems. Tell an admin."
  payment-failed: "&cThe payment could not be completed."
  pending-delivered: "&aYour pending upgrade reward was delivered."
  opened-for: "&7Opened &f{file} &7for &f{player}&7."
  success: "&a&lSUCCESS! &7Your item was upgraded to &f{item}&7."
  failed-keep: "&c&lFAILED! &7The upgrade failed, but your item is safe."
  failed-destroy: "&c&lFAILED! &7The upgrade failed and your item was destroyed."
  failed-protected: "&c&lFAILED! &7The upgrade failed, but your protection saved the item."
  problem:
    none: "&aEverything is ready."
    no-input: "&7Insert the item to upgrade."
    runes: "&7Fill every rune slot."
    costs: "&7You can't pay the other costs."
    economy: "&7No economy plugin available."
    permission: "&7You may not use this station."
    region: "&7Not allowed in this area."
  gui:
    reject-input: "&cThis slot only accepts &f{name}&c."
    reject-rune: "&cThis rune slot needs &f{name}&c."
    reject-booster: "&cThat is not a booster for this station."
    reject-protection: "&cThat is not a protection item for this station."
    reject-quick: "&cNothing in the GUI accepts that item."
  animation:
    title: "&6&lUpgrade In Progress!!"
    subtitle: "&e{percent}%"
    done-success: "&a&lUpgrade Success!"
    done-fail: "&c&lUpgrade Failed"

gui:
  back: "&e<< Back"
  cancel: "&cCancel"
  close: "&cClose"
  upgrade:
    ready: "&a&lUPGRADE"
    ready-lore:
      - "&7Everything is in place."
      - "&eClick to start the upgrade."
    not-ready: "&c&lNOT READY"
    not-ready-lore:
      - "{reason}"
    animating: "&6&lUPGRADING..."
  input:
    empty: "&eItem to upgrade"
    empty-lore:
      - "&7Place the item you want to"
      - "&7upgrade in this slot."
  rune:
    empty: "&eRune slot: &f{name}"
    empty-lore:
      - "&7Needs: &f{required}x &7{name}"
      - "&8Place the item here."
  booster:
    empty: "&bBooster slot"
    empty-lore:
      - "&7Optional: raises the success chance."
    locked: "&8No booster for this station"
  protection:
    empty: "&aProtection slot"
    empty-lore:
      - "&7Optional: saves your item if a"
      - "&7failure would destroy it."
    locked: "&8No protection for this station"
  requirements:
    name: "&6Requirements"
  costs:
    none: "&7No requirements."
    progress: "{cost} &8({have}/{need})"
    line-ok: "&a\u2714 &7{cost}"
    line-missing: "&c\u2718 &7{cost}"
  chance:
    name: "&bSuccess chance"
    lore:
      - "&7Base: &f{base}%"
      - "&7Booster: &a+{bonus}%"
      - "&7Final: &e{percent}%"
      - "{bar}"
      - "&7On failure: {fail}"
  output:
    footer:
      - ""
      - "&dUpgrade result"
    missing: "&cResult item missing"
  path:
    info:
      - "&7Choose an upgrade path."
    entry-lore:
      - "&7Needs: &f{input}"
      - "&7Becomes: &f{output}"
      - "&7Chance: &e{chance}%"
      - "&7On failure: {fail}"
      - "&7Costs:"
      - "{costs}"
      - ""
      - "&eClick to open"
  confirm:
    title: "&c&lAre you sure?"
    warning:
      - "&7If this upgrade fails, your"
      - "&7item will be &cdestroyed&7."
    accept: "&a&lYes, upgrade"
    decline: "&c&lNo, go back"

cost:
  money: "Money: {amount}"
  levels: "{amount} XP level(s)"
  item: "{amount}x {name}"
fail:
  keep: "&ayour item is kept"
  destroy: "&cyour item is destroyed"
