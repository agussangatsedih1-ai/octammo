# OctaMMO 1.0.2 - main config
# Missing keys are added automatically after an update (your values are never touched,
# the old file is copied to backups/ first).
config-version: 3

# en | id  (files in plugins/OctaMMO/lang/, any key missing in id.yml falls back to en.yml)
language: en

# auto = &-codes, &#RRGGBB, &x&R&R... or MiniMessage tags are detected per text
# legacy = never MiniMessage, minimessage = always MiniMessage
text-format: auto

# Used through the {prefix} placeholder in lang files
prefix: '&8[&x&F&F&0&0&0&0&lO&x&F&4&0&0&2&B&lc&x&E&9&0&0&5&5&lt&x&D&F&0&0&8&0&la&x&D&4&0&0&A&A&lM&x&C&9&0&0&D&5&lM&x&B&E&0&0&F&F&lO&8]'

modules:
  item-update: true
  item-upgrade: true

# --------------------------------------------------------------------------- Item Update
update:
  # true (default) = only players with octammo.update (default: OP) are updated and may use the commands
  # false = every player is updated
  require-permission: true

  # COMMAND = give the new item with the command below (the old stack is put back if the new item is not verified)
  # API     = build the item through the MMOItems API and put it in the same slot
  method: COMMAND
  give-command: "mmoitems give {type} {id} {player} {amount}"

  # What to do with an MMOItem that has no octammo signature yet:
  #   UPDATE = replace it once and sign the new item (default)
  #   STAMP  = just sign it as up to date (use this on the first rollout to avoid replacing every item once)
  #   SKIP   = leave it alone
  unsigned-items: UPDATE

  # Template stats left out of the signature (YAML keys of the item, e.g. durability). Changing this changes every signature.
  ignore-stats: []
  ignore-types: []          # e.g. [CONSUMABLE]
  ignore-ids: []            # ID or TYPE:ID
  whitelist-mode: false     # true = only the entries of `whitelist` are updated
  whitelist: []             # TYPE:ID, TYPE or ID

  update-ender-chest: false # ender chest items are replaced through the API (a give command cannot reach it)

  notify-player: true
  audit-log: true           # logs/updates.log (rotated at 2 MB)
  cooldown-ms: 3000         # minimum time between automatic scans of the same player
  inventory-open-debounce-ms: 1500
  max-items-per-batch: 20
  watch-interval-seconds: 30   # re-reads MMOItems' item files when they change, 0 = only on /octammo reload

  triggers:
    join: true
    inventory-open: true    # opening a chest, shop, ... (debounced)
    pickup: true
    interval-seconds: 0     # 0 = off

  # A new item generated by `mmoitems give` has none of the old item's custom data.
  # These options copy it back as RAW NBT text, best effort: lore and stats are NOT recomputed,
  # so gems / upgrade level can look wrong. All off by default.
  preserve:
    upgrade-level: false
    gems: false
    soulbound: false
    durability: false
    custom-nbt-keys: []

# --------------------------------------------------------------------------- Item Upgrade
upgrade:
  # Ask "are you sure?" (guis/confirm.yml) when a failure costs the input item and no protection item is inserted
  confirm-destroy: true
  # Creative players can duplicate items in custom GUIs, so they are refused by default
  allow-creative: false
  # Players also need octammo.upgrade.<station id> for every station
  require-station-permission: false
  global-cooldown: 0        # seconds between two upgrades of a player, any station

# Title loading shown after the upgrade button: the GUI closes, the title counts 1% -> 100%,
# then the result is delivered and the GUI opens again. No animation runs inside the GUI.
upgrade-loading:
  enabled: true
  duration-ticks: 100       # 100 ticks = 5 seconds (a station or path can override it with loading.duration-ticks)
  title: ''                 # empty = lang key upgrade.loading.title
  subtitle-format: ''       # empty = lang key upgrade.loading.subtitle, {percent} is replaced
  percent-step: 1           # send the title only every N percent (raise it to send fewer packets)
  title-times: { fade-in: 0, stay: 10, fade-out: 0 }   # ticks
  sound: { enabled: true, tick: BLOCK_NOTE_BLOCK_CHIME, every-percent: 10 }
  result-title-ticks: 40
  reopen-gui-after: true
  lock:
    freeze-movement: true   # slowness + negative jump boost, no PlayerMoveEvent listener
    invulnerable: true
    block-commands: true
    allowed-commands: []
    block-interact: true    # interact, place and break blocks
    block-inventory: true   # open / click inventory, change hotbar slot, swap hands
    block-drop-pickup: true
    block-combat: true

# Sounds: "entity.player.levelup" or "ENTITY_PLAYER_LEVELUP". Leave empty to disable one.
sounds:
  success: entity.player.levelup
  fail: entity.item.break
  update: entity.experience_orb.pickup
  click: ui.button.click
