# OctaMMO Crafting Station recipes.
# Each recipe supports up to six ingredients and an optional ExcellentEconomy currency cost.
# Currency id must match an existing ExcellentEconomy currency ID, not its display name.
recipes:
  example_netherite_blade:
    name: "Netherite Blade"
    description:
      - "A simple example recipe."
      - "Change or remove it to fit your server economy."
    ingredients:
      - type: MATERIAL
        material: DIAMOND_SWORD
        amount: 1
      - type: MATERIAL
        material: NETHERITE_INGOT
        amount: 1
    currency:
      id: octacoin
      amount: 1000
    result:
      type: MATERIAL
      material: NETHERITE_SWORD
      amount: 1

