    ignored: "{prefix} &cItem itu dikecualikan dari update."
    not_in_inventory: "{prefix} &cItem tidak ada di inventory-mu."
    cancelled: "{prefix} &cUpdate dibatalkan."
    failed: "{prefix} &cUpdate gagal, itemmu aman. Cek console."

